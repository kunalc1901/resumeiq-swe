<div class="dash-page">
  <app-page-header
    title="Job Match"
    subtitle="See how closely your resume aligns with a specific job opportunity."
  ></app-page-header>

  <!-- Form -->
  <div class="jm-form dash-card dash-card-pad" *ngIf="mode !== 'limit'">
    <div class="jm-usage-row">
      <span class="tag tag-accent">{{ matchesRemainingLabel }}</span>
    </div>

    <div class="form-field">
      <label class="form-label" for="resume-select">Your Resume</label>
      <select id="resume-select" class="form-select" [(ngModel)]="selectedResume">
        <option>Software_Engineer_Resume.pdf</option>
        <option>John_Doe_Resume_2024.pdf</option>
        <option>Software_Engineer_Resume_Final.pdf</option>
      </select>
    </div>

    <div class="form-field">
      <label class="form-label" for="jd-input">Job Description</label>
      <textarea
        id="jd-input"
        class="form-textarea"
        rows="7"
        placeholder="Paste the job description here..."
        [(ngModel)]="jdText"
      ></textarea>
      <p class="form-hint error" *ngIf="analyzeError">{{ errorMsg }}</p>
    </div>

    <div class="form-actions">
      <button
        type="button"
        class="btn btn-primary btn-lg"
        (click)="analyze()"
        [disabled]="mode === 'loading'"
      >
        Analyze Match
        <app-icon name="arrow-right" [size]="16" />
      </button>
    </div>
  </div>

  <!-- Limit reached -->
  <div class="dash-section" *ngIf="mode === 'limit'">
    <app-usage-limit-card
      icon="target"
      title="You've reached your monthly Job Match limit."
      message="Upgrade to Premium for 30 Job Matches per month."
      [resetLabel]="resetLabel"
      secondaryLabel="View Usage"
      (upgrade)="goUpgrade()"
      (secondary)="viewUsage()"
    />
  </div>

  <!-- Loading -->
  <div class="dash-section" *ngIf="mode === 'loading'">
    <app-analysis-loading
      title="Analyzing your match..."
      [steps]="steps"
      (complete)="onLoadingComplete()"
    ></app-analysis-loading>
  </div>

  <!-- Job Match History -->
  <div class="dash-section">
    <div class="section-row">
      <div>
        <h2 class="section-heading">Your Job Matches</h2>
        <p class="section-sub">Review your previous resume-to-job analyses.</p>
      </div>
    </div>

    <!-- Loading -->
    <div class="history-grid" *ngIf="historyLoading">
      <div class="skeleton sk-history-card" *ngFor="let _ of [0, 1, 2]"></div>
    </div>

    <!-- Error -->
    <div class="history-error dash-card dash-card-pad" *ngIf="historyError && !historyLoading">
      <div class="history-error-icon" aria-hidden="true">
        <app-icon name="alert-circle" [size]="20" />
      </div>
      <div class="history-error-body">
        <h3 class="history-error-title">We couldn't load your job matches.</h3>
        <p class="history-error-text">Please try again.</p>
      </div>
      <button type="button" class="btn btn-secondary" (click)="loadHistory()">Retry</button>
    </div>

    <!-- History cards -->
    <div class="history-grid" *ngIf="!historyLoading && !historyError && history.length">
      <app-job-match-card *ngFor="let match of history" [match]="match" />
    </div>

    <!-- Empty -->
    <div class="dash-section" *ngIf="!historyLoading && !historyError && !history.length">
      <app-empty-state
        icon="target"
        title="No job matches yet"
        text="Your job matches will appear here. Analyze a job description to see how closely your resume aligns."
      ></app-empty-state>
    </div>
  </div>
</div>
