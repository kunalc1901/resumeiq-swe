<section class="how-it-works" id="how-it-works">
  <div class="container">
    <div class="section-head" appReveal>
      <h2 class="section-title">From Resume to Insight in Three Steps.</h2>
    </div>

    <ol class="steps" appReveal>
      <li class="step" *ngFor="let step of steps; let i = index"
        [style.--reveal-delay]="i * 100 + 'ms'">
        <span class="step-num" aria-hidden="true">{{ step.number }}</span>
        <h3>{{ step.title }}</h3>
        <p>{{ step.description }}</p>
      </li>
    </ol>
  </div>
</section>
